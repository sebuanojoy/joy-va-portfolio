<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="./45809c7b312bf958f0dc6e51e09217ac.jpg" type="image/jpeg"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Joy's VA Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style id="page-css">
/* Layout: sticky pill nav, one hash-routed page at a time. Cool lilac-grey paper, deep plum-navy ink, periwinkle accent with a rose nod to "Her". Content renders from a JSON state so edit mode can save the page into itself. */
:root{
  --bg:#f3f2f8; --bg2:#e9e7f3; --card:#ffffff; --ink:#1d1b36; --muted:#5f5c78; --line:#dcd9ea;
  --accent:#5a55d2; --accent-ink:#ffffff; --accent-soft:#e7e5fb; --rose:#d9668a; --rose-soft:#fbe6ed;
  --panel:#1d1b36; --panel-ink:#f3f2fb; --panel-muted:#b9b6d6; --glass:rgba(255,255,255,.72); --shadow:0 1px 2px rgba(29,27,54,.06),0 10px 30px -12px rgba(29,27,54,.18);
  --ok:#2f9e6b;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif; --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121120; --bg2:#1b1a2e; --card:#1f1d34; --ink:#eeedf8; --muted:#a7a4c4; --line:#34314f;
  --accent:#8f8bff; --accent-ink:#14132a; --accent-soft:#2b2950; --rose:#f08fae; --rose-soft:#3a2333;
  --panel:#0c0b17; --panel-ink:#eeedf8; --panel-muted:#a7a4c4; --glass:rgba(31,29,52,.78); --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);
  --ok:#5fd19b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121120; --bg2:#1b1a2e; --card:#1f1d34; --ink:#eeedf8; --muted:#a7a4c4; --line:#34314f;
  --accent:#8f8bff; --accent-ink:#14132a; --accent-soft:#2b2950; --rose:#f08fae; --rose-soft:#3a2333;
  --panel:#0c0b17; --panel-ink:#eeedf8; --panel-muted:#a7a4c4; --glass:rgba(31,29,52,.78); --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);
  --ok:#5fd19b; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(900px 500px at 85% -10%,var(--accent-soft),transparent 60%),radial-gradient(700px 400px at -10% 30%,var(--rose-soft),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
svg.i{width:1em;height:1em;fill:currentColor;flex:none}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:-.01em}
h3{font-weight:700;letter-spacing:-.01em}
em.s{font-family:var(--display);font-style:italic;color:var(--accent);font-weight:400}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:12px}
nav{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:.95rem;white-space:nowrap;margin-right:auto}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--panel);color:var(--panel-ink);font-family:var(--display);font-weight:400;font-size:1.15rem;font-style:italic}
.logo small{font-weight:600;color:var(--muted);font-size:.75rem}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:.84rem;padding:8px 13px;border-radius:999px;transition:background .2s,color .2s}
.links a:hover{color:var(--ink);background:var(--bg2)}
.links a[aria-current="page"]{background:var(--panel);color:var(--panel-ink)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;font-size:1.05rem;padding:0;transition:transform .2s}
.iconbtn:hover{transform:rotate(18deg)}
@media(max-width:860px){nav{flex-wrap:wrap;border-radius:24px;padding:10px 10px 8px 14px}.links{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;gap:9px;font:700 .9rem/1 var(--body);text-decoration:none;cursor:pointer;color:var(--accent-ink);background:var(--accent);border:1px solid transparent;border-radius:999px;padding:13px 20px;transition:transform .18s,box-shadow .18s,background .18s;box-shadow:0 8px 20px -10px var(--accent)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -10px var(--accent)}
.btn:active{transform:translateY(1px)}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}
.btn.alt{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.alt:hover{border-color:var(--accent);color:var(--accent)}
.btn.dark{background:var(--panel);color:var(--panel-ink);box-shadow:none}
.btn.sm{padding:9px 14px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.page{display:none;padding-block:20px 56px}
.page.on{display:block;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 24px}
.sec-head h2{font-size:clamp(2.1rem,5vw,3.2rem)}
.sec-head p{color:var(--muted);max-width:52ch}
.sub-head{display:flex;align-items:center;gap:10px;font-size:1.25rem;margin:48px 0 18px}
.sub-head .i{color:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:44px}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.4rem);margin:14px 0 18px}
.hero .lead{color:var(--muted);max-width:52ch;margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--ok) 0%,transparent)}}
.niche-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.niche{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.85rem;padding:8px 13px;border-radius:12px;background:var(--accent-soft);color:var(--ink);border:1px solid transparent;cursor:pointer;font-family:inherit;transition:border-color .2s,transform .2s}
.niche:hover{border-color:var(--accent);transform:translateY(-2px)}
.niche .i{color:var(--accent)}
.portrait{position:relative;max-width:380px;width:100%;margin-inline:auto}
.portrait .frame{aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,var(--accent-soft),var(--rose-soft));border:6px solid var(--card);box-shadow:var(--shadow)}
.portrait .frame img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.float{position:absolute;display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-size:.8rem;line-height:1.25;animation:bob 6s ease-in-out infinite;max-width:220px}
.float b{display:block;font-size:.9rem}
.float .fi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.float.f2 .fi{background:var(--rose);color:#fff}
.float.f3 .fi{background:var(--panel);color:var(--panel-ink)}
.float.f1{left:-28px;top:12%}
.float.f2{right:-24px;top:46%;animation-delay:-2s}
.float.f3{left:-12px;bottom:6%;animation-delay:-4s}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding:26px}.portrait{max-width:320px}.float.f1{left:-8px}.float.f2{right:-8px}.float.f3{left:-4px}}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
@media(max-width:860px){.quick{grid-template-columns:repeat(2,1fr)}}
.qk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;transition:transform .2s,border-color .2s;min-width:0}
.qk:hover{transform:translateY(-4px);border-color:var(--accent)}
.qk:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.qk .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:1.1rem;margin-bottom:6px}
.qk b{font-size:1rem}
.qk span{font-size:.82rem;color:var(--muted)}
.qk .go{margin-top:auto;padding-top:6px;color:var(--accent);font-weight:700;font-size:.8rem;display:flex;align-items:center;gap:6px}

.band{margin-top:40px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;background:var(--panel);color:var(--panel-ink);border-radius:24px;padding:28px 30px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;width:320px;height:320px;right:-80px;top:-160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%);pointer-events:none}
.band h3{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3.6vw,2.2rem);position:relative}
.band p{color:var(--panel-muted);position:relative}
.band .row{position:relative}

/* about */
.about{display:grid;grid-template-columns:320px 1fr;gap:36px;align-items:start}
@media(max-width:860px){.about{grid-template-columns:1fr}}
.about .frame{aspect-ratio:1;border-radius:24px;overflow:hidden;background:var(--bg2);max-width:320px;margin-inline:auto;width:100%}
.about .frame img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.about h2{font-size:clamp(2rem,4.4vw,2.9rem);margin:10px 0 16px}
.about p+p{margin-top:12px}
.idcard{margin-top:16px;display:grid;gap:10px;font-size:.88rem}
.idcard div{display:flex;gap:10px;align-items:center;color:var(--muted)}
.idcard .i{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font:600 .82rem var(--body);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"],.chip.on{background:var(--panel);color:var(--panel-ink);border-color:var(--panel)}
.chip .n{font-size:.72rem;opacity:.7}
.fact{margin-top:14px;min-height:3.2em;background:var(--accent-soft);border-radius:16px;padding:14px 18px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.fact .i{color:var(--accent);margin-top:5px}
.tl{margin-top:28px;display:grid;gap:16px;padding-left:24px;border-left:2px solid var(--line)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-31px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.tl b{font-size:1rem}
.tl span{display:block;color:var(--muted);font-size:.9rem}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tools>.erow,.tools>.btn{grid-column:1/-1}
.tool{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;transition:transform .2s,border-color .2s}
.tool:hover{transform:translateY(-3px);border-color:var(--accent)}
.tb{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:1rem;flex:none}
.tool:nth-child(3n+2) .tb{background:var(--rose-soft);color:var(--rose)}
.tool:nth-child(3n) .tb{background:var(--bg2);color:var(--ink)}
.tool h3{font-size:1rem}
.tool p{color:var(--muted);font-size:.84rem;line-height:1.4}

/* samples */
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px;margin-bottom:26px}
.tab{flex:1 1 150px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 .88rem var(--body);color:var(--muted);background:none;border:0;border-radius:14px;padding:12px 14px;cursor:pointer;transition:background .2s,color .2s}
.tab:hover{color:var(--ink);background:var(--bg2)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--panel-ink)}
.tab .cnt{font-size:.7rem;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 7px;font-weight:800}
.tab .soon{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;background:var(--rose-soft);color:var(--rose);border-radius:999px;padding:2px 7px}
.tabpane[hidden]{display:none}
.pane-intro{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:18px}
.pane-intro h3{font-size:1.5rem}
.pane-intro p{color:var(--muted);font-size:.92rem;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.mk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;min-width:0}
.mk:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow)}
.mk:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mk .cover{aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--bg2)}
.mk .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.sheetart{position:absolute;inset:14px 14px 0;border-radius:10px 10px 0 0;background:var(--card);border:1px solid var(--line);border-bottom:0;display:grid;grid-template-columns:28px repeat(5,1fr);grid-auto-rows:20px;overflow:hidden}
.sheetart i{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sheetart i.h{background:var(--accent-soft)}
.sheetart i.c{background:var(--bg2)}
.ftype{position:absolute;right:12px;bottom:12px;font:800 .68rem var(--body);letter-spacing:.1em;padding:5px 9px;border-radius:8px;background:var(--panel);color:var(--panel-ink)}
.ftype.x{background:#1f7a4d;color:#fff}
.ftype.p{background:#c0392b;color:#fff}
.mk .meta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.mk h4{margin:0;font-size:1.05rem}
.mk p{color:var(--muted);font-size:.88rem}
.mk .open{margin-top:auto;padding-top:8px;color:var(--accent);font-weight:700;font-size:.82rem;display:flex;align-items:center;gap:6px}
.tag{align-self:flex-start;font:700 .66rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:999px}
.tag.rose{color:var(--rose);background:var(--rose-soft)}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:48px 20px;border:1.5px dashed var(--line);border-radius:22px;color:var(--muted)}
.empty .ei{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.5rem;background:var(--accent-soft);color:var(--accent)}
.empty b{color:var(--ink);font-size:1.05rem}
.collage{columns:3 240px;column-gap:16px}
.collage figure{margin:0 0 16px;break-inside:avoid;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .2s,box-shadow .2s}
.collage figure:hover,.collage figure:focus-visible{transform:translateY(-4px);box-shadow:var(--shadow)}
.collage figure img,.collage figure video{display:block;width:100%;height:auto}
.collage .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.collage .play span{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(20,19,42,.65);color:#fff;font-size:1.3rem}
.collage figcaption{padding:10px 12px;font-size:.84rem;font-weight:600;border-top:1px solid var(--line)}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.reel{position:relative;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.reel video{width:100%;height:100%;object-fit:cover;display:block}
.reel .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;color:#fff;font-size:.84rem;font-weight:600;background:linear-gradient(transparent,rgba(12,11,23,.8))}
.reel.link{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:18px;text-align:center;color:var(--panel-ink)}
.reel.link .ei{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:1.3rem}
.wfilters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.wcard .meta{gap:8px}
.wcard .excerpt{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}

/* written sample viewers */
.mail{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.mail .mh{display:grid;gap:4px;padding:14px 18px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:.88rem}
.mail .mh span{color:var(--muted)}
.mail .mb{padding:18px;white-space:pre-wrap;font-size:.95rem}
.post{max-width:460px;margin:0 auto;border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.post .ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .ph img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 18%}
.post .ph b{display:block;font-size:.9rem}
.post .ph span{font-size:.75rem;color:var(--muted)}
.post .pb{padding:4px 16px 18px;white-space:pre-wrap;font-size:.95rem}
.memo{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:28px 30px;font-size:.95rem}
.memo h4{margin:0 0 14px;font-size:1.4rem;letter-spacing:.3em;text-align:center}
.memo dl{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin:0 0 14px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.memo dt{font-weight:800;font-size:.8rem;letter-spacing:.08em}
.memo dd{margin:0}
.memo .mb{white-space:pre-wrap}

/* experience */
.xl{position:relative;display:grid;gap:18px;padding-left:30px}
.xl::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;border-left:2px solid var(--line)}
.xi{position:relative;display:flex;flex-direction:column;gap:6px}
.xi::before{content:"";position:absolute;left:-30px;top:30px;width:18px;height:18px;border-radius:50%;background:var(--card);border:4px solid var(--accent)}
.xi h3{font-size:1.3rem}
.xorg{font-weight:700;color:var(--accent)}
.xaddr{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.86rem}
.xi ul{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:8px;color:var(--muted);font-size:.93rem}
.xi li{display:flex;gap:10px}
.xi li .i{color:var(--accent);margin-top:5px}
.xi li b{color:var(--ink)}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.cert{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;transition:transform .2s,border-color .2s;position:relative}
.cert:hover{transform:translateY(-3px);border-color:var(--accent)}
.cert .ct{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cert .seal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);font-size:1.1rem}
.cert h4{margin:0;font-size:1.05rem}
.cert .org{font-weight:700;color:var(--accent);font-size:.85rem}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills span{font-size:.72rem;font-weight:600;background:var(--bg2);border-radius:999px;padding:3px 9px;color:var(--muted)}
.cert .new{position:absolute;top:-10px;left:18px;font:800 .62rem var(--body);letter-spacing:.12em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 9px}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.quote{margin:0;background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:26px;position:relative;overflow:hidden}
.quote .qm{font-family:var(--display);font-size:5rem;line-height:.6;color:var(--accent);display:block;height:34px}
.quote blockquote{margin:0 0 14px;font-family:var(--display);font-size:1.5rem;line-height:1.3}
.quote figcaption{display:grid;font-size:.84rem;color:var(--panel-muted)}
.quote figcaption b{color:var(--panel-ink);font-size:.92rem}

/* services */
.niches{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.niches{grid-template-columns:1fr}}
.nc{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;transition:transform .2s,border-color .2s}
.nc:hover{transform:translateY(-4px);border-color:var(--accent)}
.nc.hl{background:var(--panel);color:var(--panel-ink);border-color:var(--panel)}
.nc.hl p,.nc.hl li{color:var(--panel-muted)}
.nc .ni{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:1.3rem}
.nc.hl .ni{background:var(--accent);color:var(--accent-ink)}
.nc h3{font-family:var(--display);font-weight:400;font-size:1.9rem}
.nc p{color:var(--muted);font-size:.92rem}
.nc ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.9rem}
.nc li{display:flex;gap:9px;color:var(--muted)}
.nc li .i{color:var(--ok);margin-top:5px}
.nc .btn{margin-top:auto;align-self:flex-start}
.acc{display:grid;gap:10px}
.acc details{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px;font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc summary .car{margin-left:auto;color:var(--accent);transition:transform .3s;flex:none}
.acc details[open] summary .car{transform:rotate(45deg)}
.acc details>div{padding:0 20px 18px;color:var(--muted)}
.acc .num{font-family:var(--display);font-size:1.3rem;color:var(--accent);font-weight:400;min-width:1.6em}

/* Q&A */
.qa-tools{display:flex;gap:10px;margin-bottom:18px;max-width:520px}
.qa-tools input{flex:1}
.soc .si.lk{background:var(--accent);color:var(--accent-ink)}

/* connect */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:860px){.contact{grid-template-columns:1fr}}
.contact h2{font-size:clamp(2.1rem,4.6vw,2.8rem);margin:8px 0 10px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,textarea,select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 13px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{min-height:90px;resize:vertical}
.field textarea{min-height:130px}
.copyline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;margin:10px 0}
.copyline .i{color:var(--accent)}
.copyline code{font:600 .92rem var(--body);user-select:all;overflow-wrap:anywhere;min-width:0;flex:1}
.socials{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.soc{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.86rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;transition:transform .2s,border-color .2s}
.soc:hover{transform:translateY(-2px);border-color:var(--accent)}
.soc .si{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:.95rem;flex:none}
.soc.off{opacity:.45;pointer-events:none}
.hint{font-size:.8rem;color:var(--muted);margin-top:10px}
.links-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:18px 4px 40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(18,17,32,.55);backdrop-filter:blur(4px)}
.modal .card{max-width:640px;width:100%;max-height:88vh;overflow:auto;position:relative;animation:rise .3s ease}
.modal.wide .card{max-width:1000px}
.modal .x{position:absolute;top:14px;right:14px}
.modal h3{font-size:1.6rem;margin:6px 48px 6px 0}
.mdesc{color:var(--muted);margin-bottom:16px}
.media{display:grid;gap:12px;justify-items:start;margin-top:12px}
.media:empty{display:none}
.media video{width:100%;border-radius:14px;max-height:72vh;background:#000}
.media>img{max-width:100%;border-radius:12px}
.pdf{width:100%;display:grid;gap:10px;background:var(--bg2);border-radius:14px;padding:10px;max-height:64vh;overflow:auto}
.pdf canvas{width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.xls{width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.xls .sheets{display:flex;gap:4px;overflow-x:auto;padding:8px;background:var(--bg2);border-bottom:1px solid var(--line)}
.xls .sheets button{font:700 .78rem var(--body);border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.xls .sheets button[aria-selected="true"]{background:#1f7a4d;color:#fff;border-color:#1f7a4d}
.xls .tw{overflow:auto;max-height:60vh}
.xls table{border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums;min-width:100%}
.xls th,.xls td{border:1px solid var(--line);padding:5px 9px;white-space:nowrap;text-align:left;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.xls thead th{position:sticky;top:0;background:var(--bg2);color:var(--muted);font-weight:700;z-index:1;text-align:center}
.xls tbody th{background:var(--bg2);color:var(--muted);font-weight:600;position:sticky;left:0;text-align:center}
.xls tbody tr:first-child td{font-weight:700;color:var(--ink)}
.xls .note{padding:8px 12px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line)}
.lightbox img,.lightbox video{display:block;width:100%;max-height:78vh;object-fit:contain;border-radius:12px;background:var(--bg2);margin-top:34px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:90;background:var(--panel);color:var(--panel-ink);border-radius:999px;padding:12px 22px;font-weight:700;font-size:.9rem;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.page,header,footer{position:relative;z-index:2}

/* edit mode */
.pencil{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ebar{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--card);border:2px solid var(--accent);border-radius:22px;padding:10px 14px;box-shadow:var(--shadow);width:max-content;max-width:calc(100vw - 24px)}
.ebar span{font-size:.8rem;color:var(--muted);font-weight:600}
body.editing [data-e]{outline:2px dashed var(--accent);outline-offset:4px;border-radius:6px;cursor:text;min-width:2ch}
body.editing [data-photo]{cursor:pointer;outline:3px dashed var(--accent);outline-offset:4px}
body.editing{padding-bottom:120px}
.erow{display:grid;gap:8px;background:var(--bg2);border:1.5px dashed var(--line);border-radius:16px;padding:14px;width:100%;min-width:0}
.erow .row{gap:8px}
.erow label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.estack{display:grid;gap:12px}
.rm{font:700 .75rem var(--body);color:var(--rose);background:none;border:0;cursor:pointer;text-decoration:underline;padding:2px}
.rm[disabled]{opacity:.35;cursor:default}
.thumbsm{width:76px;height:76px;object-fit:cover;border-radius:10px;background:var(--card);flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

of Information and Communications Technology- Emerging Technologies Group","addr":"Makati City, Philippines ","text":"Executive & Admin Support: Managed executive accounts, tracked deadlines, processed user account forms, and organized vehicle logistics and supply requests as an Administrative Assistant III at DICT-ETG.\nInternal Operations: Streamlined workflows by creating DTR tracking sheets, maintaining contact directories, and collecting PDS notarization fees.\nDigital Media: Designed publication materials, wrote social media captions, and compiled engagement reports for major campaigns like SONA 2026 and DICT-BPI.\nTeam Coordination: Participated in onboarding, office orientations, and social media meetings while collaborating across teams to support daily administrative and technical operations."},{"when":"June 2025 - August 2025","role":"Intern","org":"Philippine Information Agency - Bulacan","addr":"City of  Malolos, Bulacan, Philippines","text":"Public Communication & Content Creation: Assisted in drafting press releases, news articles, and social media captions to disseminate government programs and local updates across Bulacan.\nMultimedia & Event Coverage: Supported field coverages, documented official events, and designed publication materials to boost public engagement and information reach.\nCommunity & Youth Engagement: Collaborated with fellow interns to organize an online youth forum highlighting the digital transition of public sector transactions and payments in Bulacan.\nAdministrative & Editorial Support: Monitored local news, compiled media reports, and assisted agency staff with daily administrative and communication tasks."}],"xach":[],"certs":[{"title":"Create Scroll-Stopping Content","org":"Canva","when":"November 2026","text":"Graphic designing skills, Social Media Management, Content Creation, Artificial Intelligence","link":""},{"title":"Marketing with Canva","org":"Canva","when":"November 2026","text":"Graphic designing skills, Social Media Management, Content Creation, Artificial Intelligence","link":""},{"title":"Meet Canva’s Visual Suite","org":"Canva","when":"November 2026","text":"Graphic designing skills, Social Media Management, Content Creation, Artificial Intelligence","link":""},{"title":"AI Essentials 2026","org":"Canva","when":"November 2026","text":"Graphic designing skills, Social Media Management, Content Creation, Artificial Intelligence","link":""},{"title":"Graphic Design Essentials","org":"Canva","when":"November 2026","text":"Graphic designing skills, Social Media Management, Content Creation, Artificial Intelligence","link":""}],"quotes":[{"quote":"\"You write with passion and love.\"","name":"Prof. Glenn Reynon, PhD.","role":"Bulacan State University, University of Santo Tomas"},{"quote":"\"Don't let the fire in you burn out.\"","name":"Prof. Alfonso Delos Santos","role":"Bulacan State University"}],"mock":[{"title":"Data Entry","desc":"A structured customer database containing 20 organized records with contact details, status tracking dropdowns, summary metrics, and automated validation checks to flag missing or duplicate entries.","file":{"name":"Sebuano_EA_VA_Portfolio_DATA ENTRY.xlsx","size":14675,"url":"/_blob/37689a6c09a60cecfa4e1c1c4f101723","id":"37689a6c09a60cecfa4e1c1c4f101723","wrapped":true},"link":"","cover":""},{"title":"Calendar Management","desc":"An executive weekly schedule organizing 27 items—including meetings, appointments, deadlines, reminders, and breaks—featuring automated schedule conflict detection, priority dropdowns, and a dynamic weekly grid view.","file":{"name":"Sebuano_EA_VA_Portfolio_CALENDAR MANAGEMENT.xlsx","size":18603,"url":"/_blob/7db752486909c83442752982772384de","id":"7db752486909c83442752982772384de","wrapped":true},"link":"","cover":""},{"title":"Email Management","desc":"An inbox triage tracker categorizing 15 messages by label, priority, action required, and status, complete with dynamic deadline countdowns and summary KPIs.","file":{"name":"Sebuano_EA_VA_Portfolio_EMAIL MANAGEMENT.xlsx","size":14490,"url":"/_blob/2ba4a6f44765cfe5224cc82de8857931","id":"2ba4a6f44765cfe5224cc82de8857931","wrapped":true},"link":"","cover":""},{"title":"Online Research","desc":"A verified directory of 10 real businesses across 8 industries, compiling publicly listed locations, contact details, clickable source links, and verification statuses.","file":{"name":"Sebuano_EA_VA_Portfolio_ONLINE RESEARCH.xlsx","size":15960,"url":"/_blob/00fb6b08e1dbbb3f87bac5889647c347","id":"00fb6b08e1dbbb3f87bac5889647c347","wrapped":true},"link":"","cover":""},{"title":"Social Media Management","desc":"A 7-day content calendar for a sample café brand detailing posting schedules, platforms, content formats, scroll-friendly captions with character counts, hashtags, and calls to action.","file":{"name":"Sebuano_EA_VA_Portfolio_SOC MED MANAGEMENT.xlsx","size":13291,"url":"/_blob/02d66d71f2b7cb7190b5c2ad4a53780b","id":"02d66d71f2b7cb7190b5c2ad4a53780b","wrapped":true},"link":"","cover":""}],"branding":[{"url":"/_blob/28373e31acb16572f2c2a1a7c28a86d9","id":"28373e31acb16572f2c2a1a7c28a86d9","type":"image","cap":"Kalamansi Club Branding"},{"url":"/_blob/c67e881ddf40c30a84fba2e76c2d8c3f","id":"c67e881ddf40c30a84fba2e76c2d8c3f","type":"image","cap":"Guapa Make-Up Branding"},{"url":"/_blob/f33c587d19616f5723d98b9a52ee6a52","id":"f33c587d19616f5723d98b9a52ee6a52","type":"image","cap":"Haraya Brassiere Branding"}],"written":[{"type":"Caption","title":"Haraya Brassière (Intimate Apparel Brand Board)","to":"Instagram","subject":"Empowerment & Inclusivity","body":"Real skin, real movement, real comfort. 🤎✨ Haraya Brassière is dedicated to creating pieces that honor every curve and every shade—because confidence starts underneath. #EveryBody #NaturalBeauty #InclusiveBrand #ComfortFirst"},{"type":"Caption","title":"Guapa Make-Up (Cosmetics Brand Board)","to":"Instagram","subject":"Product / Lifestyle Focus","body":"Your daily reminder to own your glow. 💖✨ From silky textures to rich, blendable pigments, Guapa Make-Up is all about feeling confident in your own skin. Drop a 💄 in the comments if you love a bold berry palette! #GuapaMakeUp #GlowUp #MakeupLovers #BeautyEssentials"},{"type":"Caption","title":"Kalamansi Club (Brand Identity & Beverage Concept)","to":"Facebook","subject":"Portfolio / Design Focus","body":"Fresh, zesty, and full of life. 🍋🌿 Sharing the complete brand identity board for Kalamansi Club—pairing playful hand-drawn typography with vibrant citrus greens and refreshing photography to capture that crisp, \"squeeze the day\" energy. Which logo variation is your favorite? #BrandIdentity #LogoDesign #KalamansiClub #GraphicDesign"},{"type":"Memo","title":"Memorandum Sample 1","to":"All Team Members","subject":"Updated Guidelines for Meeting Requests and Calendar Management","body":"To prevent scheduling overlaps and protect dedicated focus blocks on the executive calendar, all internal meeting requests will now follow a standardized booking process effective Monday, November 30, 2026.\n\nWhen requesting time on the executive calendar, please submit meeting details at least 48 hours in advance and include a clear agenda, required attendees, and preferred duration. Any recurring meetings without an active agenda will be reviewed at the end of each month to free up bandwidth. Additionally, please avoid booking meetings during daily deep-work blocks between 9:00 AM and 11:00 AM unless the matter is time-sensitive and pre-approved.\n\nThank you for your cooperation in keeping our weekly schedules running smoothly. Please reach out directly if you need assistance coordinating urgent appointments."},{"type":"Memo","title":"Memorandum Sample 2","to":"Operations & Customer Support Teams","subject":"Q4 CRM Data Hygiene and Record Verification Audit","body":"As we prepare for year-end reporting, we are conducting a brief audit of our customer database to ensure all active client records are accurate, complete, and free of duplicates.\n\nBy Friday, December 4, 2026, team members responsible for client intake should review their assigned entries to confirm that full names, primary email addresses, phone numbers, and current account statuses are properly logged. Any incomplete or inactive records should be flagged in the notes column so they can be updated or archived accordingly. Maintaining clean records now will ensure seamless communication and accurate metrics heading into the first quarter.\n\nIf you encounter any formatting issues or duplicate entries in the shared sheet, please notify me so we can resolve them promptly."},{"type":"Memo","title":"Memorandum Sample 3","to":"[Client's Name]","subject":"Weekly Operations & Administrative Briefing","body":"This memo serves as a summary of key administrative milestones completed this week, alongside pending items requiring leadership review before next week begins.\n\nOver the past week, inbox triage was completed daily with all urgent client inquiries routed and resolved within two hours of receipt. The upcoming seven-day social media content calendar has also been drafted and queued, and preliminary market research on ten prospective vendor partners has been compiled into the shared directory for your review.\n\nTo keep next week's deliverables on track, please review and approve the drafted holiday social media captions by tomorrow afternoon. Once signed off, all posts will be scheduled ahead of the December rollout. Please let me know if any priorities need to be adjusted for Monday morning."},{"type":"Email","title":"Requesting Information or Approval","to":"client@mail.com","subject":"Quick Approval Needed: [Item/Deliverable Name]","body":"Hi [Recipient Name],\n\nTo keep [Project/Task Name] right on schedule, I am reaching out to get your quick review and confirmation on [specific detail, file, or approval needed]. If you are able to share your feedback by [Day, Date at Time], I will make sure everything is finalized and sent out promptly. Thank you so much for your time and help!\n\nBest regards,\nJoy Andrei Sebuano"},{"type":"Email","title":"Polite Follow-Up (No Response)","to":"client@mail.com","subject":"Following up: [Original Subject Line]","body":"Hi [Recipient Name],\n\nI wanted to gently bring this back to the top of your inbox in case it got buried during a busy week. Have you had a chance to look over the [document/proposal/request] I sent across earlier? Whenever you have a spare moment, please let me know your thoughts so we can keep everything moving smoothly ahead of our [Deadline/Event].\n\nBest regards,\nJoy Andrei Sebuano"},{"type":"Email","title":"End-of-Day / Weekly Status Update","to":"client@mail.com","subject":"Weekly Progress Update","body":"Hi [Client Name],\n\nI wanted to share a quick wrap-up of everything accomplished this week alongside what is queued up next. Over the past few days, I successfully cleared and organized the inbox, updated our customer records, and finalized the upcoming week's social media schedule. Moving into next week, my focus will shift toward [Upcoming Task 1] and [Upcoming Task 2], though I will just need your quick sign-off on [Item Needing Approval] before I publish it. Please let me know if you would like me to adjust any of these priorities before Monday.\n\nBest regards,\nJoy Andrei Sebuano"},{"type":"Email","title":"Rescheduling a Meeting","to":"client@mail.com","subject":"Rescheduling: [Meeting Title] originally set for [Date]","body":"Hi [Recipient Name],\n\nI hope your week is going well. Unfortunately, due to an unexpected scheduling conflict on [Client Name]’s calendar, we need to move our upcoming [Meeting Title] currently set for [Original Date & Time]. We would still love to connect as soon as possible—would [New Option 1] or [New Option 2] work for you instead? I apologize for any inconvenience this shift causes and truly appreciate your flexibility.\n\nBest regards,\nJoy Andrei Sebuano"},{"type":"Email","title":"Scheduling & Calendar Coordination","to":"client@mail.com","subject":"Meeting Request: [Topic] — [Client Name] / [Recipient Name]","body":"Hi [Recipient Name],\n\nI am reaching out on behalf of [Client Name] to coordinate a brief [duration, e.g., thirty-minute] meeting to discuss [Topic]. Looking at [Client Name]’s availability this week, we have openings on [Day, Date] at [Time] or [Day, Date] at [Time] [Time Zone]. Please let me know if either of those slots works well on your end, or feel free to suggest a few times that better fit your schedule and I will happily send over the calendar invitation.\n\nBest regards,\nJoy Andrei Sebuano"},{"type":"Email","title":"Client Onboarding & Kickoff","to":"client@mail.com","subject":"Welcome aboard! Getting started with [Client/Company Name]","body":"I am excited to start working with you and supporting [Client/Company Name].\n\n To ensure a smooth kickoff, I would love to get access to your preferred calendar, email, and project management tools, along with a quick rundown of your top priorities for this week and how you prefer to communicate. Whenever you have fifteen minutes free over the next couple of days, let me know what time works best for a quick introductory call, or feel free to reply directly with those details so I can dive right in.\n\nBest regards,\nJoy Andrei Sebuano"}],"posts":[],"reels":[],"qa":[{"q":"Can you follow written instructions?","a":"Yes. I carefully read briefs, SOPs, and guidelines step by step to ensure every detail and formatting requirement is met accurately before submitting work. If anything is unclear or missing context, I clarify early rather than guessing."},{"q":"Can you communicate professionally?","a":"Yes. I keep updates clear, concise, and polite across email and messaging platforms, flag blockers early, and confirm next steps so expectations stay aligned."},{"q":"Can you work independently?","a":"Yes. Once a task or workflow is defined, I can manage my own queue, organize files, run checks, and deliver completed work on schedule without needing constant micromanagement."},{"q":"What type of client do you want?","a":"I work best with founders, busy professionals, creatives, and growing teams who value clear communication, realistic timelines, and organized systems—especially in media, content/publishing, e-commerce, and service-based businesses."},{"q":"What problems can you help solve?","a":"I help lighten operational load by organizing calendars and flagging conflicts, triaging inboxes and drafting clear replies, cleaning and validating data in spreadsheets, compiling verified online research, and planning or formatting social media content."},{"q":"What tools and software are you proficient in?","a":"I am comfortable working with Google Workspace (Docs, Sheets, Gmail, Calendar, Drive), Microsoft Office, Canva for visual branding and social media graphics, and standard project management and communication tools like Trello, Notion, Slack, and Zoom—and I pick up new platforms quickly."},{"q":"How do you handle confidential or sensitive information?","a":"I treat all client data, credentials, and internal documents with strict discretion. I use secure password managers rather than storing raw logins, double-check recipient lists before sharing files, and never share or reuse client information outside the scope of work."},{"q":"How do you verify the accuracy of your work before submitting it?","a":"I build verification checks directly into my workflow—such as using data validation rules and duplicate checks in spreadsheets, cross-referencing links during research, and proofreading copy for tone, dates, and formatting before marking any task complete."},{"q":"How do you prioritize tasks when everything feels urgent?","a":"I categorize tasks by deadline and business impact—handling time-sensitive executive blockers and client-facing deliverables first, grouping routine admin tasks into dedicated blocks, and confirming priorities with you whenever competing deadlines overlap."},{"q":"What do you do if you realize you might miss a deadline?","a":"I flag it as early as possible rather than waiting until the due time. I let the client know what has already been completed, explain what caused the bottleneck, and propose a realistic revised delivery time or interim check-in."},{"q":"How do you handle repetitive or routine administrative work?","a":"I stay consistent by creating checklists, templates, and clean tracking systems so routine tasks like inbox triage, data entry, and scheduling stay fast, accurate, and easy to audit."},{"q":"How do you handle constructive feedback or revisions?","a":"I welcome feedback as part of learning a client's exact preferences. I take notes on style, tone, and formatting adjustments so I can apply them consistently to future tasks without needing the same reminder twice."},{"q":"What are the specifications of your device?","a":"I work on a 64-bit Windows laptop (x64-based processor) powered by an AMD Ryzen 5 4500U processor running at 2.38 GHz with integrated AMD Radeon Graphics (496 MB) and 8.00 GB of installed RAM (7.37 GB usable). For storage, it features a dual-drive setup combining a fast 119 GB Toshiba SSD for smooth day-to-day performance and software responsiveness alongside a spacious 932 GB Western Digital HDD for safely storing client files, spreadsheets, and media assets."},{"q":"What are your working hours and time zone?","a":"I am based in the Philippines (Philippine Standard Time, PHT / UTC+8), and my schedule is flexible to accommodate overlap with US, UK, Australian, or Asian business hours. We can establish fixed core overlap hours for live check-ins and urgent requests while I handle asynchronous tasks smoothly."},{"q":"Are you available full-time or part-time?","a":"I am open to both part-time and full-time arrangements depending on the scope of support you need. I can start with a consistent part-time block of hours per week and scale up as your operational workload grows."},{"q":"What is your internet setup and backup plan?","a":"I work from a dedicated home setup with a stable high-speed fiber internet connection, backed up by mobile data hotspots and a backup power source (such as a power bank/UPS for my router and devices) so brief outages do not interrupt deadlines or communication."},{"q":"How do you prefer to communicate and report progress?","a":"I adapt easily to your preferred workflow—whether that is Slack, Microsoft Teams, WhatsApp, or email—and keep task tracking transparent in tools like Trello, Asana, Notion, or Google Sheets. I provide brief end-of-day or weekly progress summaries highlighting completed tasks, upcoming priorities, and anything needing your sign-off."},{"q":"What is your expected salary?","a":"My rate is flexible depending on whether the role is part-time, full-time, or project-based, as well as the specific scope of responsibilities. I am happy to discuss a fair hourly rate or monthly retainer that aligns with your budget and the level of ongoing support you are looking for."},{"q":"Why do you want to become a Virtual Assistant?","a":"I want to become a virtual assistant because I genuinely enjoy bringing order to busy workflows and helping people reclaim time to focus on their core work. My background in broadcasting and public communication trained me to juggle tight deadlines, organize information clearly, and adapt quickly to changing priorities—skills that translate naturally into executive and administrative support. Remote work also allows me to build long-term, dependable partnerships with clients across different industries while continually sharpening my operational, research, and digital organization skills."},{"q":"","a":""}],"links":[]}</script>

}

async function attachMockFile(i, f){
  if(f.size > 14 * 1024 * 1024){ toast("That file is over 14 MB. Add a link to it instead."); return; }
  const a = await getAssets(); if(!a) return;
  toast("Uploading " + f.name + "…");
  const e = extOf(f.name);
  try{
    let r, wrapped = false;
    if(e === "pdf") r = await a.upload(f, {type:"application/pdf"});
    else if(["png","jpg","jpeg","gif","webp"].includes(e)) r = await a.upload(f.size > 12e6 ? await toBlob(f, 3000, .9) : f, {type: f.size > 12e6 ? "image/jpeg" : (f.type || "image/png")});
    else if(e === "csv") r = await a.upload(f, {type:"text/csv"});
    else { const b64 = b64FromBuf(await f.arrayBuffer()); r = await a.upload(new Blob([JSON.stringify({name:f.name, mime:f.type || "", b64})], {type:"application/json"}), {type:"application/json"}); wrapped = true; }
    S.mock[i].file = {name: f.name, size: f.size, url: r.url, id: r.id, wrapped};
    if(!S.mock[i].title || S.mock[i].title === "New mock-up task") S.mock[i].title = f.name.replace(/\.[^.]+$/, "");
    renderSamples(); toast("Uploaded. Press Save to keep it.");
  }catch(err){ toast("Upload failed" + (err && err.code ? " (" + err.code + ")" : "") + ". Try a smaller file."); }
}
async function fileBytes(file){
  const res = await fetch(file.url); if(!res.ok) throw new Error("fetch");
  if(file.wrapped){ const j = await res.json(); return bufFromB64(j.b64); }
  return new Uint8Array(await res.arrayBuffer());
}
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
async function renderPdf(box, bytes){
  box.innerHTML = '<p class="hint">Loading the PDF…</p>';
  try{
    if(!window.pdfjsLib) throw 0;
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
    box.innerHTML = ""; const n = Math.min(pdf.numPages, 40);
    for(let p = 1; p <= n; p++){
      const page = await pdf.getPage(p); const w = (box.clientWidth - 20) || 600; const base = page.getViewport({scale:1});
      const vp = page.getViewport({scale: (w / base.width) * Math.min(window.devicePixelRatio || 1, 2)});
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise; box.appendChild(c);
    }
    if(pdf.numPages > n) box.insertAdjacentHTML("beforeend", `<p class="hint">Showing the first ${n} pages.</p>`);
  }catch(_){ box.innerHTML = '<p class="hint">The preview could not load here. Use Download to open the file.</p>'; }
}
const colName = n => { let s = ""; n++; while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
function renderSheet(box, bytes, isCsv){
  if(!window.XLSX){ box.innerHTML = '<p class="hint">The spreadsheet preview could not load here. Use Download to open the file.</p>'; return; }
  let wb;
  try{ wb = isCsv ? XLSX.read(new TextDecoder().decode(bytes), {type:"string"}) : XLSX.read(bytes, {type:"array", cellDates:true}); }
  catch(_){ box.innerHTML = '<p class="hint">This spreadsheet could not be read for a preview. Use Download to open it.</p>'; return; }
  const wrap = document.createElement("div"); wrap.className = "xls"; box.appendChild(wrap);
  const show = name => {
    const ws = wb.Sheets[name];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false, blankrows:true});
    const R = Math.min(rows.length, 500), C = Math.min(Math.max(1, ...rows.slice(0, R).map(r => r.length)), 40);
    const tabs = wb.SheetNames.length > 1 ? `<div class="sheets" role="tablist">${wb.SheetNames.map(n => `<button type="button" role="tab" aria-selected="${n === name}" data-sh="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : "";
    let t = `<thead><tr><th></th>${Array.from({length:C}, (_, c) => `<th>${colName(c)}</th>`).join("")}</tr></thead><tbody>`;
    for(let r = 0; r < R; r++){ t += `<tr><th>${r + 1}</th>${Array.from({length:C}, (_, c) => `<td title="${esc(rows[r][c])}">${esc(rows[r][c])}</td>`).join("")}</tr>`; }
    t += "</tbody>";
    wrap.innerHTML = tabs + `<div class="tw"><table>${t}</table></div>` + (rows.length > R ? `<div class="note">Showing the first ${R} of ${rows.length} rows. Download the file to see everything.</div>` : R ? "" : `<div class="note">This sheet is empty.</div>`);
    $$("[data-sh]", wrap).forEach(b => b.addEventListener("click", () => show(b.dataset.sh)));
  };
  show(wb.SheetNames[0]);
}
async function downloadFile(file){
  const d = await claude.use("downloads");
  if(!d){ toast("Downloading isn't available in this view"); return; }
  try{
    const bytes = await fileBytes(file);
    await d.save({filename: file.name, data: new Blob([bytes])});
  }catch(err){
    const c = err && err.code;
    if(c === "declined") return;
    toast(c === "rejected_extension" ? "This file type can't be downloaded here" : "The download didn't start. Try again.");
  }
}
function openMock(i){
  const m = S.mock[i]; const f = m.file; const k = fileKind(f);
  const mo = modal(`<span class="tag">${k === "sheet" ? "Spreadsheet" : k === "pdf" ? "PDF" : k === "image" ? "Image" : "Mock-up task"}</span>

  box.innerHTML = '<p class="hint">Loading preview…</p>';

    else renderSheet(box, bytes, extOf(f.name) === "csv");

async function addMedia(key, files){
  const a = await getAssets(); if(!a) return;
  const ok = files.filter(f => /^(image|video)\//.test(f.type || ""));
  if(!ok.length){ toast("Please choose photos or videos"); return; }
  let n = 0; const fresh = [];
  for(const f of ok){
    toast("Uploading " + (n + 1) + " of " + ok.length + "…");
    try{
      if(f.type.startsWith("video/")){ if(f.size > 20 * 1024 * 1024){ toast(f.name + " is over 20 MB and was skipped"); continue; } const r = await a.upload(f, {type: f.type}); fresh.push({url:r.url, id:r.id, type:"video", cap:""}); }
      else { const big = f.size > 8e6 || !/^image\/(png|jpeg|webp|gif)$/.test(f.type); const r = big ? await a.upload(await toBlob(f, 3200, .9), {type:"image/jpeg"}) : await a.upload(f, {type:f.type}); fresh.push({url:r.url, id:r.id, type:"image", cap:""}); }

/* --- reels --- */
async function addReels(files){
  const a = await getAssets(); if(!a) return;
  let n = 0;
  for(const f of files){ if(!(f.type || "").startsWith("video/")) continue; if(f.size > 20 * 1024 * 1024){ toast(f.name + " is over 20 MB. Add it as a link."); continue; } toast("Uploading " + f.name + "…"); try{ const r = await a.upload(f, {type:f.type}); S.reels.unshift({type:"video", url:r.url, id:r.id, cap:"", link:""}); n++; }catch(_){} }
  renderSamples(); if(n) toast("Reels added. Press Save to keep them.");
}
function renderReels(){
  const p = $("#pane-reels"), list = S.reels;
  let h = intro("re", "Reels", "Short-form videos I've edited for TikTok, Instagram and Facebook.");
  if(editing){
    h += `<div class="estack"><div class="row"><button class="btn sm" type="button" id="add-reel">${ic("plus")} Upload reel videos</button><button class="btn sm alt" type="button" id="add-reel-link">${ic("plus")} Add a reel link</button></div>
      ${list.map((x, i) => `<div class="erow"><div class="row">${x.type === "video" ? `<video class="thumbsm" src="${esc(x.url)}" muted preload="metadata"></video>` : `<span class="thumbsm" style="display:grid;place-items:center;color:var(--accent)">${ic("ext")}</span>`}<div style="flex:1;display:grid;gap:8px;min-width:0">${inp(`reels.${i}.cap`, x.cap, "Caption")}${x.type === "link" ? inp(`reels.${i}.link`, x.link, "Link to the reel", "https://www.tiktok.com/…") : ""}</div></div><div class="row">${mvBtns("reels", i, list.length)}<button class="rm" type="button" data-rm="reels.${i}">remove</button></div></div>`).join("")}
      <p class="hint">Videos up to 20 MB upload here. For longer reels, add a link to TikTok, Instagram or Facebook.</p></div>`;
    p.innerHTML = h; afterIntro(p);
    $("#add-reel").addEventListener("click", () => pickFile(files => addReels(files), "video/*", true));
    $("#add-reel-link").addEventListener("click", () => { S.reels.unshift({type:"link", url:"", cap:"", link:""}); renderSamples(); });

  }
  h += list.length ? `<div class="reels">${list.map(x => x.type === "video" ? `<div class="reel"><video src="${esc(x.url)}" controls playsinline preload="metadata"></video>${x.cap ? `<span class="cap">${esc(x.cap)}</span>` : ""}</div>`

  p.innerHTML = h;
}

/* modal */
function modal(inner, wide, label){
  closeModal();
  const m = document.createElement("div"); m.className = "modal" + (wide ? " wide" : ""); m.id = "modal";
  m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label", label || "Details");
  m.innerHTML = `<div class="card"><button class="iconbtn x" type="button" aria-label="Close">${ic("x")}</button>${inner}</div>`;
  m.addEventListener("click", e => { if(e.target === m) closeModal(); });
  $$('a[href^="#"]', m).forEach(a => a.addEventListener("click", () => closeModal()));
  document.body.appendChild(m);
  $(".x", m).addEventListener("click", () => closeModal());
  $(".x", m).focus();
  return m;
}
function closeModal(){ const m = $("#modal"); if(m) m.remove(); }
addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

document.addEventListener("paste", e => { const t = e.target; if(editing && t.dataset && t.dataset.e !== undefined){ e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData.getData("text/plain") || "").replace(/\s+/g, " ")); } });
document.addEventListener("click", e => {
  if(!editing) return;
  const rm = e.target.closest("[data-rm]"), ad = e.target.closest("[data-add]"), mv = e.target.closest("[data-mv]");
  if(rm){ const p = rm.dataset.rm, k = p.lastIndexOf("."); getP(p.slice(0, k)).splice(+p.slice(k + 1), 1); renderDyn(); }
  if(ad){ const a = ad.dataset.add; S[a][TOP.includes(a) ? "unshift" : "push"](NEW[a]()); renderDyn(); }
  if(mv && !mv.disabled){ const p = mv.dataset.mv, k = p.lastIndexOf("."), list = getP(p.slice(0, k)), i = +p.slice(k + 1), j = i + +mv.dataset.d; if(j >= 0 && j < list.length){ [list[i], list[j]] = [list[j], list[i]]; renderDyn(); } }
});

/* saving the page into itself */
const FALLBACK_RESET = ":root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
function buildDoc(){
  const reset = (document.head.querySelector("style") || {}).textContent || FALLBACK_RESET;
  const json = JSON.stringify(S).replace(/</g, "\\u003c").split(String.fromCharCode(8232)).join("\\u2028").split(String.fromCharCode(8233)).join("\\u2029");
  const body = [
    "<title>Joy's VA Portfolio</title>",
    '<meta name="claude:viewport-fit-sides" content="cover">',
    $('link[rel="stylesheet"]').outerHTML, $("#page-css").outerHTML, $("#defs").outerHTML, $("#pdfjs").outerHTML, $("#xlsxjs").outerHTML,
    '<div id="app"></div>', $("#tpl").outerHTML,
    `<script type="application/json" id="state">${json}<\/script>`, $("#main-js").outerHTML
  ].join("\n");
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${reset}</style></head><body>${body}</body></html>`;
}
let saving = false;
async function save(){
  if(saving || !art) return; saving = true;
  const b = $("#esave"); if(b) b.textContent = "Saving…";
  try{ await art.publish(buildDoc()); toast("Saved"); }
  catch(err){ saving = false; if(b) b.textContent = "Save"; toast(err && err.code === "conflict" ? "A newer version was saved first. The page is reloading." : "Couldn't save. Please try again."); }
}
function showPencil(){
  const p = document.createElement("button"); p.className = "btn pencil"; p.type = "button"; p.id = "pencil";
  p.innerHTML = `${ic("pen")} Edit page`; p.addEventListener("click", startEditing); document.body.appendChild(p);
}
function startEditing(){
  editing = true; document.body.classList.add("editing"); const p = $("#pencil"); if(p) p.remove();
  setEditable(); renderDyn();
  const bar = document.createElement("div"); bar.className = "ebar"; bar.id = "ebar";
  bar.innerHTML = `<span>Editing: tap dashed text or your photo. Lists have their own boxes.</span><button class="btn sm" id="esave" type="button">Save</button><button class="btn sm alt" id="ediscard" type="button">Discard</button>`;
  document.body.appendChild(bar);
  $("#esave").addEventListener("click", save);
  $("#ediscard").addEventListener("click", () => { editing = false; document.body.classList.remove("editing"); S = JSON.parse(ORIGINAL); $("#ebar").remove(); closeModal(); mount(); showPencil(); toast("Changes discarded"); });
}

mount();
(async () => {
  try{
    const [a, u] = await Promise.all([claude.use("artifact"), claude.use("user")]);
    art = a; canEdit = !!(a && u && u.canEdit());
    if(canEdit) showPencil();
  }catch(_){ /* visitors just see the page */ }
})();
